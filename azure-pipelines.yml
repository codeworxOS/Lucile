# Starter pipeline

# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- dev

pool:
  vmImage: windows-latest

variables:
  major: 2
  minor: 0
  packageName: 'Lucile.Primitives'
  efPackageName: 'Lucile.EntityFrameworkCore'
  projects: 'src/Lucile.Primitives;src/Lucile.AspNetCore;src/Lucile.Core;src/Lucile.EntityFramework;src/Lucile.Dynamic;src/Lucile.Dynamic.DependencyInjection;src/Lucile.ServiceModel;src/Lucile.ServiceModel.DependencyInjection;src/Lucile.Windows'
  efProjects: 'src/Lucile.EntityFrameworkCore'
  testProjects: 'test/**/*.Test.csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'sqllocaldb start mssqllocaldb'
    
- task: UseDotNet@2
  displayName: install .net 8 sdk
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: UseDotNet@2
  displayName: install .net 9 sdk
  inputs:
    packageType: 'sdk'
    version: '9.x'

- task: UseDotNet@2
  displayName: install .net 10 sdk
  inputs:
    packageType: 'sdk'
    version: '10.x'


- task: DotNetCoreCLI@2
  displayName: Run dotnet test
  inputs:
    command: 'test'
    projects: '$(testProjects)'
    feedsToUse: 'select'
    versioningScheme: 'off'
- task: DotNetCoreCLI@2
  displayName: "Install package-version tool"
  inputs:
    command: 'custom'
    custom: 'tool'
    arguments: 'install Codeworx.PackageVersion -g'

- task: DotNetCoreCLI@2
  displayName: "Get next PackageVersion"
  inputs:
    command: 'custom'
    custom: 'package-version'
    arguments: '$(packageName) -m $(major) -n $(minor) -o DevOps -p $(prerelease)'

- task: DownloadSecureFile@1
  inputs:
    secureFile: 'lucile_signkey.snk'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Agent.TempDirectory)'
    Contents: 'lucile_signkey.snk'
    TargetFolder: './private'

- task: Bash@3
  displayName: "Update build version"
  inputs:
    targetType: 'inline'
    script: |
      # Write your commands here
      echo '##vso[build.updatebuildnumber]$(PackageVersion)'
      echo '##vso[task.setvariable variable=CorePackageVersion;]$(PackageVersion)'

- task: DotNetCoreCLI@2
  displayName: "run dotnet pack"
  inputs:
    command: 'pack'
    packagesToPack: '$(projects)'
    configuration: '$(buildConfiguration)'
    versioningScheme: 'off'
    buildProperties: 'Version=$(PackageVersion);FileVersion=$(PackageVersionFileVersion);AssemblyVersion=$(major).0.0.0;SignAssembly=true;AssemblyOriginatorKeyFile=..\..\private\lucile_signkey.snk;ApiCompatGenerateSuppressionFile=true'

- task: DotNetCoreCLI@2
  displayName: "Get next PackageVersion EF8"
  inputs:
    command: 'custom'
    custom: 'package-version'
    arguments: '$(efPackageName) -m $(major) -n $(minor)8000 -o DevOps -p $(prerelease)'

- task: DotNetCoreCLI@2
  displayName: "run dotnet pack EF8"
  inputs:
    command: 'pack'
    packagesToPack: '$(efProjects)'
    configuration: '$(buildConfiguration)'
    versioningScheme: 'off'
    buildProperties: 'LucileCoreVersion=$(CorePackageVersion);EfVersion=8;Version=$(PackageVersion);FileVersion=$(PackageVersionFileVersion);AssemblyVersion=$(major).0.0.0;SignAssembly=true;AssemblyOriginatorKeyFile=..\..\private\lucile_signkey.snk'

- task: DotNetCoreCLI@2
  displayName: "Get next PackageVersion EF9"
  inputs:
    command: 'custom'
    custom: 'package-version'
    arguments: '$(efPackageName) -m $(major) -n $(minor)9000 -o DevOps -p $(prerelease)'

- task: DotNetCoreCLI@2
  displayName: "run dotnet pack EF9"
  inputs:
    command: 'pack'
    packagesToPack: '$(efProjects)'
    configuration: '$(buildConfiguration)'
    versioningScheme: 'off'
    buildProperties: 'LucileCoreVersion=$(CorePackageVersion);EfVersion=9;Version=$(PackageVersion);FileVersion=$(PackageVersionFileVersion);AssemblyVersion=$(major).0.0.0;SignAssembly=true;AssemblyOriginatorKeyFile=..\..\private\lucile_signkey.snk'

- task: DotNetCoreCLI@2
  displayName: "Get next PackageVersion EF 10"
  inputs:
    command: 'custom'
    custom: 'package-version'
    arguments: '$(efPackageName) -m $(major) -n $(minor)1000 -o DevOps -p $(prerelease)'

- task: DotNetCoreCLI@2
  displayName: "run dotnet pack EF10"
  inputs:
    command: 'pack'
    packagesToPack: '$(efProjects)'
    configuration: '$(buildConfiguration)'
    versioningScheme: 'off'
    buildProperties: 'LucileCoreVersion=$(CorePackageVersion);EfVersion=10;Version=$(PackageVersion);FileVersion=$(PackageVersionFileVersion);AssemblyVersion=$(major).0.0.0;SignAssembly=true;AssemblyOriginatorKeyFile=..\..\private\lucile_signkey.snk'


- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
